<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ikshaa">
  <!-- The arched double door of a Goan-Portuguese house — the same shape the
       heritage page opens on. It survives 16px because it is one silhouette
       and one hole: at that size the divider disappears and it still reads as
       a lit doorway rather than a smudge.

       The ink square is its own ground, so the mark holds on a light tab bar
       and a dark one without needing a prefers-color-scheme variant. -->
  <rect width="32" height="32" rx="6.5" fill="#2e2a24"/>
  <path d="M9.5 25.6V14.2a6.5 6.5 0 0 1 13 0v11.4z" fill="#efe6d6"/>
  <path d="M16 7.8v17.8" stroke="#2e2a24" stroke-width="1.1" stroke-linecap="square"/>
</svg>
