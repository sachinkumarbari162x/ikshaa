<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Ikshaa</title>
    <!-- Cormorant Garamond for display, Jost for text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat/chat.css">
    <!-- The hero still, fetched in parallel with the CSS so it can paint as
         early as possible. Must stay in step with .pageHeroImage below. -->
    <link rel="preload" as="image" href="./galleryImages/poolArea/IkshaaPool.webp" fetchpriority="high">
</head>

<body>

    <nav class="navbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false"
            aria-controls="navPanel">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- A div, not an h1: on this page the <h1> belongs to the page title -->
        <div class="villaName"><a href="index.html">Ikshaa</a></div>

        <a class="navBook" href="stayWithUs.html">Book Now</a>

        <div class="nav-panel" id="navPanel">
            <ul class="nav-links" id="navLinks">
                <li><a href="ourHeritage.html" data-preview="ourHeritage">Our Heritage</a></li>
                <li><a href="gallery.html" data-preview="gallery">Gallery</a></li>
                <li><a href="exploreIkshaa.html" data-preview="villaTour">Villa Tour</a></li>
                <li><a href="exploreGoa.html" data-preview="exploreGoa">Explore Goa</a></li>
                <li><a href="goanCuisine.html" data-preview="goanCuisine">Goan Cuisine</a></li>
                <li><a href="index.html#outdoor" data-preview="outdoor">Outdoor</a></li>
                <li><a href="index.html#local-eateries" data-preview="localEateries">Local Eateries</a></li>
                <li><a href="index.html#life-in-goa" data-preview="lifeInGoa">Life in Goa</a></li>
                <li><a href="index.html#goa-fit" data-preview="goaFit">Goa Fit</a></li>
                <li><a href="guestBook.html" data-preview="guestBook">Guest Book</a></li>
                <li><a href="findingUs.html" data-preview="findingUs">Finding Us</a></li>
                <li><a href="stayWithUs.html" data-preview="stayWithUs">Stay With Us</a></li>
            </ul>

            <div class="nav-preview" id="navPreview">
                <img class="previewImage isVisible" data-preview="ourHeritage"
                    data-src="./hamBurgerDropImages/OurHeritage/IkshaaDoor.webp" alt="">
                <img class="previewImage" data-preview="gallery"
                    data-src="./hamBurgerDropImages/Gallery/IkshaaPool.webp" alt="">
                <img class="previewImage" data-preview="villaTour"
                    data-src="./hamBurgerDropImages/VillaTour/mainGateOfIkshaa.avif" alt="">
                <img class="previewImage" data-preview="exploreGoa"
                    data-src="./hamBurgerDropImages/ExploreGoa/goaRoads.webp" alt="">
                <img class="previewImage" data-preview="goanCuisine"
                    data-src="./hamBurgerDropImages/GoanCuisine/dining.webp" alt="">
                <img class="previewImage" data-preview="outdoor"
                    data-src="./hamBurgerDropImages/Outdoor/paragliding.webp" alt="">
                <img class="previewImage" data-preview="localEateries"
                    data-src="./hamBurgerDropImages/localEatery/eclairs.webp" alt="">
                <img class="previewImage" data-preview="lifeInGoa"
                    data-src="./hamBurgerDropImages/lifeInGoa/boatingGoa.webp" alt="">
                <img class="previewImage" data-preview="goaFit"
                    data-src="./hamBurgerDropImages/GoAfiT/ParraRoadGoa.webp" alt="">
                <img class="previewImage" data-preview="guestBook"
                    data-src="./hamBurgerDropImages/GuestBook/toasting.webp" alt="">
                <img class="previewImage" data-preview="findingUs"
                    data-src="./hamBurgerDropImages/FindingUs/chorlaghat.webp" alt="">
                <img class="previewImage" data-preview="stayWithUs"
                    data-src="./hamBurgerDropImages/StayWithUs/Courtyard.webp" alt="">
            </div>
        </div>
    </nav>

    <header class="pageHero" data-nav-dark>
        <picture><source srcset="./galleryImages/poolArea/IkshaaPool.avif" type="image/avif"><source srcset="./galleryImages/poolArea/IkshaaPool.webp" type="image/webp"><img class="pageHeroImage" src="./galleryImages/poolArea/IkshaaPool.webp" alt="" fetchpriority="high" decoding="async"></picture>
        <div class="pageHeroScrim"></div>
        <h1 class="pageHeroTitle">Gallery</h1>
        <p class="scrollCue">Scroll</p>
    </header>

    <main class="siteContent">
        <div class="galleryGrid">

            <!-- Each tile stacks its group's photos in one box and crossfades
                 between them in random order. The rotation only runs while the
                 tile is on screen — script.js starts it on intersection. The
                 first image of each stack is the fixed opening frame. -->
            <section class="galleryTile">
                <div class="galleryStack">
                    <picture><source srcset="./galleryImages/mainBedroom/IkshaaMaster.avif" type="image/avif"><source srcset="./galleryImages/mainBedroom/IkshaaMaster.webp" type="image/webp"><img class="galleryLayer isVisible" src="./galleryImages/mainBedroom/IkshaaMaster.webp" alt="Main bedroom"
                        loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/mainBedroom/IkshaaBedroom.avif" type="image/avif"><source srcset="./galleryImages/mainBedroom/IkshaaBedroom.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/mainBedroom/IkshaaBedroom.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                    <picture><source srcset="./galleryImages/mainBedroom/bed3.avif" type="image/avif"><source srcset="./galleryImages/mainBedroom/bed3.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/mainBedroom/bed3.webp" alt="" loading="lazy" decoding="async"></picture>
                </div>
                <h2 class="galleryTileTitle">Main Bedroom</h2>
                <button class="galleryTrigger" type="button" aria-label="View Main Bedroom photos"></button>
            </section>
            <section class="galleryTile">
                <div class="galleryStack">
                    <picture><source srcset="./galleryImages/secondBedroom/IkshaaBedroom2.avif" type="image/avif"><source srcset="./galleryImages/secondBedroom/IkshaaBedroom2.webp" type="image/webp"><img class="galleryLayer isVisible" src="./galleryImages/secondBedroom/IkshaaBedroom2.webp" alt="Second bedroom"
                        loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/secondBedroom/IkshaaTwinBed.avif" type="image/avif"><source srcset="./galleryImages/secondBedroom/IkshaaTwinBed.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/secondBedroom/IkshaaTwinBed.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                    <picture><source srcset="./galleryImages/secondBedroom/IkshaaWindow.avif" type="image/avif"><source srcset="./galleryImages/secondBedroom/IkshaaWindow.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/secondBedroom/IkshaaWindow.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                </div>
                <h2 class="galleryTileTitle">Second Bedroom</h2>
                <button class="galleryTrigger" type="button" aria-label="View Second Bedroom photos"></button>
            </section>

            <!-- NB: copies of livingroom2/3 also sit in galleryImages/kitchen/
                 where they look misfiled. These use the livingRoom copies. -->
            <section class="galleryTile">
                <div class="galleryStack">
                    <picture><source srcset="./galleryImages/livingRoom/livingroom3.avif" type="image/avif"><source srcset="./galleryImages/livingRoom/livingroom3.webp" type="image/webp"><img class="galleryLayer isVisible" src="./galleryImages/livingRoom/livingroom3.webp" alt="Living room"
                        loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/livingRoom/livingroom2.avif" type="image/avif"><source srcset="./galleryImages/livingRoom/livingroom2.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/livingRoom/livingroom2.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                    <picture><source srcset="./galleryImages/livingRoom/IkshaaSitting2.avif" type="image/avif"><source srcset="./galleryImages/livingRoom/IkshaaSitting2.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/livingRoom/IkshaaSitting2.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                </div>
                <h2 class="galleryTileTitle">Living Room</h2>
                <button class="galleryTrigger" type="button" aria-label="View Living Room photos"></button>
            </section>
            <section class="galleryTile">
                <div class="galleryStack">
                    <picture><source srcset="./galleryImages/dinning/dining.avif" type="image/avif"><source srcset="./galleryImages/dinning/dining.webp" type="image/webp"><img class="galleryLayer isVisible" src="./galleryImages/dinning/dining.webp" alt="Dining area"
                        loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/dinning/toasting.avif" type="image/avif"><source srcset="./galleryImages/dinning/toasting.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/dinning/toasting.webp" alt="" loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/dinning/juice.avif" type="image/avif"><source srcset="./galleryImages/dinning/juice.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/dinning/juice.webp" alt="" loading="lazy" decoding="async"></picture>
                </div>
                <h2 class="galleryTileTitle">Dining</h2>
                <button class="galleryTrigger" type="button" aria-label="View Dining photos"></button>
            </section>

            <!-- TODO: only one true kitchen photo so far; second is a stand-in -->
            <section class="galleryTile">
                <div class="galleryStack">
                    <picture><source srcset="./galleryImages/kitchen/kitchen.avif" type="image/avif"><source srcset="./galleryImages/kitchen/kitchen.webp" type="image/webp"><img class="galleryLayer isVisible" src="./galleryImages/kitchen/kitchen.webp" alt="Kitchen"
                        loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/kitchen/IkshaaCandles.avif" type="image/avif"><source srcset="./galleryImages/kitchen/IkshaaCandles.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/kitchen/IkshaaCandles.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                </div>
                <h2 class="galleryTileTitle">Kitchen</h2>
                <button class="galleryTrigger" type="button" aria-label="View Kitchen photos"></button>
            </section>
            <section class="galleryTile">
                <div class="galleryStack">
                    <picture><source srcset="./galleryImages/poolArea/IkshaaPool2.avif" type="image/avif"><source srcset="./galleryImages/poolArea/IkshaaPool2.webp" type="image/webp"><img class="galleryLayer isVisible" src="./galleryImages/poolArea/IkshaaPool2.webp" alt="Pool area"
                        loading="lazy" decoding="async"></picture>
                    <picture><source srcset="./galleryImages/poolArea/Courtyard.avif" type="image/avif"><source srcset="./galleryImages/poolArea/Courtyard.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/poolArea/Courtyard.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                    <picture><source srcset="./galleryImages/poolArea/CourtyardNight.avif" type="image/avif"><source srcset="./galleryImages/poolArea/CourtyardNight.webp" type="image/webp"><img class="galleryLayer" src="./galleryImages/poolArea/CourtyardNight.webp" alt="" loading="lazy"
                        decoding="async"></picture>
                </div>
                <h2 class="galleryTileTitle">Pool Area</h2>
                <button class="galleryTrigger" type="button" aria-label="View Pool Area photos"></button>
            </section>

        </div>
    </main>

    <!-- Enlarged viewer. Opens on the photo the tile was showing, then the
         arrows step through that group manually. -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightboxClose" id="lightboxClose" type="button" aria-label="Close viewer">&times;</button>

        <button class="lightboxNav lightboxPrev" id="lightboxPrev" type="button" aria-label="Previous photo">
            &#8249;</button>

        <!-- Fixed-size stage. The photo is centred inside it, so a small or
             differently-shaped image never changes the frame's footprint. -->
        <div class="lightboxStage">
            <img class="lightboxImage" id="lightboxImage" src="" alt="">
        </div>

        <button class="lightboxNav lightboxNext" id="lightboxNext" type="button" aria-label="Next photo">
            &#8250;</button>

        <p class="lightboxCaption" id="lightboxCaption"></p>
    </div>

    <script src="script.js"></script>

    <!-- Chat widget. One script, not five: chat.js fetches its own language
         engine (nlu, knowledge, bot — 34KB) when the browser goes idle or the
         visitor first moves, so first paint never waits on a panel most
         people do not open. -->
    <script src="chat/chat.js" defer></script>
</body>

</html>
